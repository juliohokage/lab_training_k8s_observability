apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vts
  namespace: tracing
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-traces-single
      version: "0.1.13"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    createNamespace: true
  values:
    server:
      persistentVolume:
        size: 10Gi
      retentionPeriod: 2d
