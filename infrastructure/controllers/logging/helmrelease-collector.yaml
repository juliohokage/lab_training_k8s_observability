apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collector
  namespace: logging
spec:
  interval: 1h
  dependsOn:
    - name: vls
      namespace: logging
  chart:
    spec:
      chart: victoria-logs-collector
      version: "0.3.5"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    createNamespace: true
  values:
    remoteWrite:
      - url: http://vls-victoria-logs-single-server.logging.svc:9428
