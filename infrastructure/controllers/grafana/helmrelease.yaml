apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "14.5.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  install:
    createNamespace: true
  values:
    persistence:
      enabled: true
      size: 2Gi
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            access: proxy
            url: http://vmselect-vmc.monitoring.svc:8481/select/prometheus
            jsonData:
              httpHeaderName1: AccountID
              httpHeaderName2: ProjectID
            secureJsonData:
              httpHeaderValue1: "0"
              httpHeaderValue2: "0"
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            access: proxy
            url: http://vls-victoria-logs-single-server.logging.svc:9428
            jsonData:
              httpHeaderName1: AccountID
              httpHeaderName2: ProjectID
            secureJsonData:
              httpHeaderValue1: "0"
              httpHeaderValue2: "0"
          - name: VictoriaTraces
            uid: victoriatraces
            type: jaeger
            access: proxy
            url: http://vts-vt-single-server.tracing.svc:10428/select/jaeger
            jsonData:
              httpHeaderName1: AccountID
              httpHeaderName2: ProjectID
            secureJsonData:
              httpHeaderValue1: "0"
              httpHeaderValue2: "0"
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        # ConfigMaps in the grafana namespace labelled grafana_dashboard=1
        searchNamespace: grafana
