# VictoriaMetrics operator: manages the VMCluster in infrastructure/configs/monitoring.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-operator
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.68.2"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    admissionWebhooks:
      enabled: true
      certManager:
        enabled: false
