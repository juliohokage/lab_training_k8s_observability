apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - flux-system
  # o11y stack: controllers (operators, backends, Grafana) -> configs (collectors) -> apps (test signals)
  - infrastructure.yaml
  - apps.yaml
  # Crossplane control plane -> platform API (XRDs, Compositions, Functions) -> tenant XRs
  - crossplane.yaml
  - platform.yaml
  - tenants.yaml
