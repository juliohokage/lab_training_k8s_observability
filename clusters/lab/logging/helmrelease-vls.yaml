apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vls
  namespace: logging
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-logs-single
      version: "0.13.7"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
  install:
    createNamespace: true
  values:
    server:
      persistentVolume:
        size: 10Gi
      retentionPeriod: 2d
